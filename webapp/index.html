<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎵 Discord Music Player</title>
  <meta name="description" content="Premium Discord Music Player — поиск и воспроизведение музыки с YouTube, Spotify, SoundCloud" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <!-- Настройка: здесь прописывается IP твоего VDS -->
  <script src="/static/config.js"></script>
</head>
<body>
  <!-- Background particles -->
  <div class="bg-particles" id="bgParticles"></div>

  <div class="app-container" id="app">

    <!-- ── HEADER ──────────────────────────────────────────── -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M9 18V5l12-2v13" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="6" cy="18" r="3" stroke="url(#logoGrad)" stroke-width="2"/>
            <circle cx="18" cy="16" r="3" stroke="url(#logoGrad)" stroke-width="2"/>
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                <stop stop-color="#a855f7"/>
                <stop offset="1" stop-color="#3b82f6"/>
              </linearGradient>
            </defs>
          </svg>
          <span>MusicBot</span>
        </div>
      </div>
      <div class="header-right">
        <button class="btn-icon" id="btnAdmin" title="Admin Panel" onclick="toggleAdmin()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ── MAIN LAYOUT ─────────────────────────────────────── -->
    <main class="app-main">

      <!-- LEFT: Search Panel -->
      <aside class="panel panel-search" id="searchPanel">
        <div class="panel-header">
          <h2>Поиск</h2>
        </div>
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="Название, исполнитель или ссылка..."
            autocomplete="off"
          />
          <button class="search-btn" id="searchBtn" onclick="doSearch()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>

        <!-- Platform filters -->
        <div class="platform-filters">
          <button class="filter-btn active" data-platform="all" onclick="setFilter(this, 'all')">Все</button>
          <button class="filter-btn" data-platform="YouTube" onclick="setFilter(this, 'YouTube')">
            <span class="platform-dot" style="background:#FF0000"></span>YouTube
          </button>
          <button class="filter-btn" data-platform="SoundCloud" onclick="setFilter(this, 'SoundCloud')">
            <span class="platform-dot" style="background:#FF5500"></span>SC
          </button>
          <button class="filter-btn" data-platform="Spotify" onclick="setFilter(this, 'Spotify')">
            <span class="platform-dot" style="background:#1DB954"></span>Spotify
          </button>
        </div>

        <!-- Search results -->
        <div class="search-results" id="searchResults">
          <div class="empty-state">
            <div class="empty-icon">🎵</div>
            <p>Введи название трека или вставь ссылку</p>
          </div>
        </div>
      </aside>

      <!-- CENTER: Player -->
      <section class="panel panel-player" id="playerPanel">

        <!-- Album art -->
        <div class="album-art-wrapper">
          <div class="album-art" id="albumArt">
            <div class="album-placeholder">
              <svg width="60" height="60" viewBox="0 0 24 24" fill="none">
                <path d="M9 18V5l12-2v13" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="6" cy="18" r="3" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
                <circle cx="18" cy="16" r="3" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
              </svg>
            </div>
          </div>
          <div class="album-glow" id="albumGlow"></div>

          <!-- Platform badge -->
          <div class="platform-badge" id="platformBadge" style="display:none">
            <div class="platform-badge-inner" id="platformBadgeInner"></div>
          </div>
        </div>

        <!-- Track info -->
        <div class="track-info">
          <h1 class="track-title" id="trackTitle">Ничего не играет</h1>
          <p class="track-artist" id="trackArtist">Найди трек и начни слушать</p>
        </div>

        <!-- Progress bar -->
        <div class="progress-section">
          <span class="time-label" id="timeElapsed">0:00</span>
          <div class="progress-bar-wrap" id="progressWrap">
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
              <div class="progress-bar-thumb" id="progressThumb" style="left:0%"></div>
            </div>
          </div>
          <span class="time-label" id="timeDuration">0:00</span>
        </div>

        <!-- Controls -->
        <div class="controls">
          <button class="ctrl-btn ctrl-secondary" id="btnLoop" onclick="toggleLoop()" title="Режим повтора">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
          </button>
          <button class="ctrl-btn ctrl-prev" id="btnPrev" title="Предыдущий">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="ctrl-btn ctrl-play" id="btnPlay" onclick="togglePlayPause()">
            <svg class="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <svg class="icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none">
              <rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>
            </svg>
          </button>
          <button class="ctrl-btn ctrl-next" id="btnNext" onclick="skipTrack()" title="Следующий">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="ctrl-btn ctrl-secondary" id="btnStop" onclick="stopPlayer()" title="Стоп">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
            </svg>
          </button>
        </div>

        <!-- Volume -->
        <div class="volume-section">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <input type="range" id="volumeSlider" min="0" max="100" value="50" oninput="setVolume(this.value)" />
          <span id="volumeLabel">50%</span>
        </div>
      </section>

      <!-- RIGHT: Queue Panel -->
      <aside class="panel panel-queue" id="queuePanel">
        <div class="panel-header">
          <h2>Очередь</h2>
          <span class="queue-count" id="queueCountBadge">0</span>
        </div>
        <div class="queue-list" id="queueList">
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <p>Очередь пуста</p>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <!-- ── ADMIN PANEL MODAL ────────────────────────────────── -->
  <div class="modal-overlay" id="adminOverlay" onclick="closeAdmin(event)">
    <div class="modal admin-modal" id="adminModal">
      <div class="modal-header">
        <h2>⚙️ Панель администратора</h2>
        <button class="btn-icon" onclick="closeAdminPanel()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Admin login form -->
      <div id="adminLoginForm">
        <p class="admin-hint">Введи свой Discord User ID для доступа</p>
        <div class="admin-input-group">
          <input type="text" id="adminIdInput" placeholder="Discord User ID..." pattern="[0-9]+" />
          <button class="btn-primary" onclick="adminLogin()">Войти</button>
        </div>
        <p class="admin-error" id="adminError" style="display:none">❌ Нет доступа</p>
      </div>

      <!-- Admin dashboard (shown after auth) -->
      <div id="adminDashboard" style="display:none">
        <div class="admin-tabs">
          <button class="admin-tab active" onclick="showAdminTab(this, 'guilds')">Серверы</button>
          <button class="admin-tab" onclick="showAdminTab(this, 'chains')">Цепочки</button>
        </div>

        <!-- Guilds tab -->
        <div class="admin-tab-content" id="adminTabGuilds">
          <div class="admin-guilds" id="adminGuildsList">
            <div class="loading-spinner"></div>
          </div>
        </div>

        <!-- Chains tab -->
        <div class="admin-tab-content" id="adminTabChains" style="display:none">
          <div class="admin-guild-select">
            <select id="adminChainGuildSelect" onchange="loadAdminChains()">
              <option value="">Выбери сервер...</option>
            </select>
          </div>
          <div class="admin-chains" id="adminChainsList">
            <div class="empty-state"><p>Выбери сервер</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── TOAST NOTIFICATIONS ─────────────────────────────── -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/static/app.js"></script>
</body>
</html>
